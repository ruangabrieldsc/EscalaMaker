<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>EscalaMaker</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>


<div id="edit-modal" class="modal hidden">
    <div class="modal-content">

        <h2>Editar atendente</h2>

        <label>Nome: </label>
        <input type="text" id="edit-name">

        <label>Empresas: </label>
        <div id="edit-list-container"></div>

            <button type="button" id="add-item-btn">
                + Adicionar empresa
            </button>

        <div class="modal-buttons">
            <button id="save-btn">Salvar</button>
            <button id="cancel-btn">Cancelar</button>
        </div>

    </div>
</div>

<body>

<div id="top-bar">

    <div id="header-note-container">
        <input
            type="text"
            id="header-note"
            placeholder=""
        >
    </div>

    <div id="top-buttons">

        <div id="pages-container">
            <button id="pages-btn" type="button">Pages · 1 ▼</button>
            <div id="pages-menu" class="hidden">
                <button class="page-option" data-page="1" type="button">Página 1</button>
                <button class="page-option" data-page="2" type="button">Página 2</button>
                <button class="page-option" data-page="3" type="button">Página 3</button>
            </div>
        </div>

        <button id="reset-btn">
            RESET
        </button>

    </div>

</div>

<div id="users-container">

    <div class="user">
        <div class="profile-card">
            <img src="fotos/default.png">
            <p>Default user</p>

            <div class="button-group">
                <button class="edit-btn">Edit</button>
                <button class="delete-btn">Del</button>
            </div>
        </div>

        <div class="list-box"></div>
    </div>

    <button id="add-user-btn">+</button>

</div>

    <script src="script.js"></script>
</body>
</html>
